# Step 2: render the clips Claude chose (episodes/<name>/clips.json on the `episodes` branch).
# Clips are published as a GitHub release named clips-<name>; preview strips go back to
# the episodes branch so Claude can check the framing.
name: render
on:
  workflow_dispatch:
    inputs:
      name:
        description: Episode name used in the transcribe step
        required: true
      only:
        description: Optional comma-separated clip numbers to render, e.g. 1,2,3 (default all)
        required: false
        default: ""
      style:
        description: Optional style for every clip (clean, fast, hype); overrides clips.json
        required: false
        default: ""

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      NAME: ${{ inputs.name }}
      STYLE: ${{ inputs.style }}
      ONLY: ${{ inputs.only }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg fonts-inter
      - run: pip install -q -r requirements.txt
      # yt-dlp needs a JavaScript runtime to solve YouTube's player challenges.
      - uses: denoland/setup-deno@v2
      - name: YouTube cookies (optional secret YT_COOKIES)
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -n "$YT_COOKIES" ]; then
            printf '%s\n' "$YT_COOKIES" > "$RUNNER_TEMP/cookies.txt"
            echo "AUTOCLIP_COOKIES=$RUNNER_TEMP/cookies.txt" >> "$GITHUB_ENV"
          fi
      - uses: actions/cache/restore@v4
        with:
          path: ~/autoclip-work/${{ inputs.name }}/source.mp4
          key: video-${{ inputs.name }}
      - name: Load transcript and clips.json
        run: |
          git fetch -q --depth 1 origin episodes
          d=~/autoclip-work/$NAME
          mkdir -p $d
          for f in transcript.json clips.json source.json; do
            git show FETCH_HEAD:episodes/$NAME/$f > $d/$f
          done
      - name: Re-download if the cached video expired
        run: |
          d=~/autoclip-work/$NAME
          if [ ! -f $d/source.mp4 ]; then
            url=$(python -c "import json; print(json.load(open('$d/source.json'))['url'])")
            section=$(python -c "import json; print(json.load(open('$d/source.json'))['section'] or '')")
            python -m autoclip fetch "$url" "$NAME" ${section:+--section "$section"}
          fi
      - name: Render
        timeout-minutes: 300
        run: python -m autoclip render "$NAME" ${STYLE:+--style "$STYLE"} ${ONLY:+--only "$ONLY"}
      # Publish whatever finished even if a later clip failed or the job ran out of time.
      - name: Publish
        if: always()
        run: |
          d=~/autoclip-work/$NAME
          tools/save_to_episodes.sh "$NAME" "Rendered: $NAME" $d/*.preview.jpg $d/out/captions.md $d/broll.txt
          tag=clips-$NAME
          # Parallel batch renders can race to create the release; losing the race is fine.
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --target main --title "Clips: $NAME" --notes-file $d/out/captions.md || \
            gh release view "$tag" >/dev/null
          gh release upload "$tag" $d/out/*.mp4 $d/out/captions.md --clobber
          echo "Clips: ${{ github.server_url }}/${{ github.repository }}/releases/tag/$tag" >> $GITHUB_STEP_SUMMARY
