# Every 15 minutes: post the clips that are due in queue.txt, refresh view counts (hourly),
# alert on Reels past 1,000 views and rewrite the dashboard. This repo is public, so the
# data, dashboard and alerts live in the private repo <owner>/clip-dashboard (or the DATA_REPO variable); see
# autoclip/social.py. Secrets: IG_TOKENS, STATE_KEY, DATA_TOKEN (optional NTFY_TOPIC).
name: social
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      sync:
        description: Refresh view counts now
        type: boolean
        default: true
      post:
        description: Post what's due in the queue
        type: boolean
        default: true

permissions:
  contents: write
  issues: write

# Never two runs at once: they could post the same clip twice.
concurrency:
  group: social
  cancel-in-progress: false

jobs:
  social:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      IG_TOKENS: ${{ secrets.IG_TOKENS }}
      STATE_KEY: ${{ secrets.STATE_KEY }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      DATA_REPO: ${{ vars.DATA_REPO || format('{0}/clip-dashboard', github.repository_owner) }}
      DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
    steps:
      # No stored credentials: the job only pushes to the data repo, with DATA_TOKEN.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run
        run: |
          python3 -m autoclip.social \
            ${{ inputs.sync && '--sync' || '' }} \
            ${{ github.event_name == 'workflow_dispatch' && !inputs.post && '--no-post' || '' }}
